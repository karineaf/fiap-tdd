server:
  port: 808
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - shutdown
  endpoint:
    shutdown:
      enabled: true

logging:
  level:
    root: INFO
    org.example: INFO
    org.springframework: INFO